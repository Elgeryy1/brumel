title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Brumel is in **Pre-development**: there are no builds or downloads yet.
        The [README](https://github.com/Elgeryy1/brumel#readme) and [docs index](https://github.com/Elgeryy1/brumel/blob/main/docs/README.md) answer many common questions.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you already read or tried?
