name: Documentation
description: Something in the docs is wrong, unclear, outdated or missing.
title: "[Docs] "
labels: ["type:docs", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Document and section
      placeholder: "docs/architecture/UPSTREAM_STRATEGY.md, section: Rebase process"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Factually wrong
        - Unclear or confusing
        - Outdated
        - Inconsistent with another document
        - Missing information
        - Broken link
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong and what should it say? Include sources for factual corrections.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to submit a pull request for this.
